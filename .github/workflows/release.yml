name: Build and Release

permissions:
  contents: write

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build - ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: rs_chunkmerger-windows-amd64.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: rs_chunkmerger-macos-arm64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: rs_chunkmerger-linux-amd64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact_name: rs_chunkmerger-linux-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libvulkan-dev libxkbcommon-x11-dev libfontconfig-dev libwayland-dev libx11-xcb-dev libegl1-mesa-dev libxcursor-dev libxi-dev libxrandr-dev libxinerama-dev libxrender-dev libxfixes-dev libglib2.0-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
        shell: bash

      - name: Rename artifact
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            mv target/${{ matrix.target }}/release/rs_chunkmerger.exe ${{ matrix.artifact_name }}
          else
            mv target/${{ matrix.target }}/release/rs_chunkmerger ${{ matrix.artifact_name }}
          fi
        shell: bash

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifact-${{ matrix.target }}
          path: ${{ matrix.artifact_name }}

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: artifact-*
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            rs_chunkmerger-windows-amd64.exe
            rs_chunkmerger-macos-arm64
            rs_chunkmerger-linux-amd64
            rs_chunkmerger-linux-arm64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
