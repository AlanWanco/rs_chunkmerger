[package]
name = "rs_chunkmerger"
version = "0.5.1"
edition = "2024"

[dependencies]
walkdir = "2"
natord = "1"
which = "5"
gpui-kit = { version = "=0.6.6", features = ["component"] }
anyhow = "1"
rfd = "0.15"
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSImage"] }
objc2-foundation = { version = "0.3", features = ["NSData"] }

[build-dependencies]
winres = "0.1"
